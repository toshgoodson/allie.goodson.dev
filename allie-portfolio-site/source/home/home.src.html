<style>

html,body{margin:0}

.shot.pv{padding:0;display:block;overflow:hidden}

.pf{position:absolute;border-radius:6px;background:#fff;overflow:hidden;border:2px solid #FDFAF3;box-shadow:5px 6px 0 rgba(20,18,64,.38)}
.pf.ph{border-radius:10px}
.pf img{display:block;width:100%;height:100%;object-fit:cover;object-position:top}
.pk{position:absolute;filter:drop-shadow(3px 4px 0 rgba(20,18,64,.32))}
.vp{--page:#FDFAF3;--ink:#262068;--ln:rgba(38,32,104,.14);--pill:#262068;--pt:#FDFAF3;--chip:#DAECFF;--ct:#262068;--blurb:#262068;--tgb:#FF5B4D;--tgc:#262068;position:relative;border-radius:12px;overflow:hidden;background:var(--page);border:0.5px solid rgba(38,32,104,.15)}

.pg{position:relative;background:var(--page);transition:background .3s}
.hero{position:relative;overflow:hidden}
.stage{position:absolute;left:0;top:0;width:680px;height:400px;transform-origin:0 0}
.stage svg{position:absolute;inset:0;width:680px;height:400px}
.tx{position:absolute;pointer-events:none}
.cb{font-family:'Corben',serif;font-weight:700}
.cr{font-family:'Corben',serif;font-weight:400}

.pill{pointer-events:auto;position:relative;height:40px;width:40px;border-radius:20px;background:var(--pill);overflow:hidden;transition:width .55s cubic-bezier(.65,0,.35,1),background .3s}

.vp.op .bgr{opacity:0;transform:rotate(90deg);pointer-events:none}
.lk{position:absolute;left:0;top:0;height:40px;display:flex;align-items:center;gap:2px;padding:0 4px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s}

.lk a.on{background:var(--chip);color:var(--ct)}
.tg{pointer-events:auto;position:relative;width:48px;height:48px;margin-left:6px;display:flex;align-items:center;justify-content:center;color:var(--tgc);cursor:pointer;font-size:20px;line-height:1;transition:transform .5s cubic-bezier(.2,.8,.2,1)}

.tg svg.bg{position:absolute;inset:0;width:48px;height:48px}

.tg .ic{position:relative}
.nbk{position:absolute;left:0;right:0;top:0;height:84px;z-index:5;background:var(--page);pointer-events:none;transform:translateY(-100%);transition:transform .45s cubic-bezier(.2,.8,.2,1),background .3s;-webkit-mask:linear-gradient(#000,#000) top/100% 66px no-repeat,radial-gradient(51% 100% at 50% 0,#000 calc(100% - 1px),transparent 100%) 0 64px/88px 20px round no-repeat;mask:linear-gradient(#000,#000) top/100% 66px no-repeat,radial-gradient(51% 100% at 50% 0,#000 calc(100% - 1px),transparent 100%) 0 64px/88px 20px round no-repeat}

#cv{position:absolute;inset:0;width:100%;height:100%;z-index:9;pointer-events:none}

html.m .wr{width:390px}
html.m .stage{width:390px;height:700px}

html.m .row{height:auto}

html.m .rows:hover .row:not(:hover) .lab{opacity:1}

.mm.open a{opacity:1;transform:none}
.mm.open a:nth-of-type(1){transition-delay:.06s}.mm.open a:nth-of-type(2){transition-delay:.1s}.mm.open a:nth-of-type(3){transition-delay:.14s}.mm.open a:nth-of-type(4){transition-delay:.18s}

.mm.open .mmd{transform:none}
html.m .nav>.nm,html.m .nav>.pill,html.m .nav>.tg{position:relative;z-index:1}
.vp.mo .nm{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.mm,.mm a,.mmd{transition:none!important}}

</style>
</head>

 o.v+=((o.h?96:0)-o.r)*.045;o.v*=.85;o.r+=o.v;o.cx+=(o.mx-o.cx)*.14;o.cy+=(o.my-o.cy)*.14;
