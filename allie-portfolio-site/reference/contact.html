html,body{margin:0}
body{background:#FDFAF3;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;transition:background .3s}
body.dk{background:#14122E}
.pp{--page:#FDFAF3;--ink:#262068;--mut:#625E94;--card:#FFFFFF;--ln:rgba(38,32,104,.12);--ty:#FFF0C7;--tp:#E7E8FF;--tk:#FDE3F4;--band:#4F50CF;--sh:rgba(20,18,64,.38);--pill:#262068;--pt:#FDFAF3;--chip:#DAECFF;--ct:#262068;--tgb:#FF5B4D;--tgc:#262068;--hd:#262068;--hdc:#FDFAF3;--board:#3B3B3D;--bf:#ECE9E1;--nv:#262068;--ht:#262068;width:680px;margin:0 auto;position:relative;background:var(--page);color:var(--ink);transition:background .3s}
.pp.dk{--page:#14122E;--ink:#EDEBFA;--mut:#A9A6D6;--card:#1E1B44;--ln:rgba(237,235,250,.12);--ty:#3A2F12;--tp:#24225C;--tk:#3A1C3A;--band:#0E0C30;--sh:rgba(0,0,0,.5);--pill:#3A36A0;--pt:#F4F1FF;--chip:#DAECFF;--ct:#1E1B52;--tgb:#FFE7A6;--tgc:#1E1B52;--hd:#DAECFF;--hdc:#1E1B52;--board:#232325;--bf:#26243F;--nv:#0B0A26;--ht:#FDFAF3}
.ic{width:1em;height:1em;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.top{position:sticky;top:0;z-index:30;height:64px;margin-bottom:-64px}
.nbk{position:absolute;left:0;right:0;top:0;height:84px;background:var(--page);pointer-events:none;transform:translateY(-100%);transition:transform .45s cubic-bezier(.2,.8,.2,1),background .3s;-webkit-mask:linear-gradient(#000,#000) top/100% 66px no-repeat,radial-gradient(51% 100% at 50% 0,#000 calc(100% - 1px),transparent 100%) 0 64px/88px 20px round no-repeat;mask:linear-gradient(#000,#000) top/100% 66px no-repeat,radial-gradient(51% 100% at 50% 0,#000 calc(100% - 1px),transparent 100%) 0 64px/88px 20px round no-repeat}
.pp.sc .nbk{transform:none}
.nav{position:relative;display:flex;align-items:center;padding:12px}
.nm{height:40px;display:flex;align-items:center;padding:0 16px 3px;box-sizing:border-box;line-height:1;border-radius:20px;background:var(--pill);color:#FF6B5C;font-size:16px;font-family:'Corben',serif;font-weight:700;transition:background .3s}
.lk{height:40px;display:flex;align-items:center;gap:2px;padding:0 4px;border-radius:20px;background:var(--pill);transition:background .3s}
.lk a{font-size:13px;color:var(--pt);padding:7px 12px;border-radius:16px;cursor:pointer;display:flex;align-items:center;gap:4px}
.lk a.on{background:var(--chip);color:var(--ct)}
.tg{position:relative;width:48px;height:48px;margin-left:6px;display:flex;align-items:center;justify-content:center;color:var(--tgc);cursor:pointer;font-size:20px;line-height:1;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
