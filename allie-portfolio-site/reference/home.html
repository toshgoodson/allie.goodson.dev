html,body{margin:0}
body{background:#ECE9E1;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;color:#262068}
.wr{width:680px;margin:0 auto;padding:16px 0 24px}
.ic{width:1em;height:1em;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ctl{display:flex;align-items:center;gap:12px;margin-top:14px;font-size:13px}
.ctl button{display:flex;align-items:center;gap:6px;font:inherit;font-size:13px;color:#262068;background:#FDFAF3;border:0.5px solid rgba(38,32,104,.25);border-radius:8px;padding:6px 12px;cursor:pointer}
.ctl span{color:#625E94}
.shot.pv{padding:0;display:block;overflow:hidden}
.shot.pv>svg{position:absolute;inset:0;width:100%;height:100%}
.pf{position:absolute;border-radius:6px;background:#fff;overflow:hidden;border:2px solid #FDFAF3;box-shadow:5px 6px 0 rgba(20,18,64,.38)}
.pf.ph{border-radius:10px}
.pf img{display:block;width:100%;height:100%;object-fit:cover;object-position:top}
.pk{position:absolute;filter:drop-shadow(3px 4px 0 rgba(20,18,64,.32))}
.vp{--page:#FDFAF3;--ink:#262068;--ln:rgba(38,32,104,.14);--pill:#262068;--pt:#FDFAF3;--chip:#DAECFF;--ct:#262068;--blurb:#262068;--tgb:#FF5B4D;--tgc:#262068;position:relative;border-radius:12px;overflow:hidden;background:var(--page);border:0.5px solid rgba(38,32,104,.15)}
.vp.dk{--page:#14122E;--ink:#EDEBFA;--ln:rgba(237,235,250,.14);--pill:#3A36A0;--pt:#F4F1FF;--chip:#DAECFF;--ct:#1E1B52;--blurb:#FBE8F6;--tgb:#FFE7A6;--tgc:#1E1B52}
.pg{position:relative;background:var(--page);transition:background .3s}
.hero{position:relative;overflow:hidden}
.stage{position:absolute;left:0;top:0;width:680px;height:400px;transform-origin:0 0}
.stage svg{position:absolute;inset:0;width:680px;height:400px}
.tx{position:absolute;pointer-events:none}
.cb{font-family:'Corben',serif;font-weight:700}
.cr{font-family:'Corben',serif;font-weight:400}
.st{font-family:'Corben',serif;font-weight:700;letter-spacing:-1.3px}
.hd{display:flex;justify-content:space-between;padding:96px 28px 12px;font-size:12px;color:var(--ink)}
.row{position:relative;height:120px;border-top:0.5px solid var(--ln);overflow:hidden;cursor:pointer}
.lab{position:relative;z-index:2;height:100%;display:flex;align-items:center;justify-content:space-between;padding:0 28px;pointer-events:none;color:#fff;mix-blend-mode:difference;transition:opacity .4s}
.rows:hover .row:not(:hover) .lab{opacity:.3}
.layer{position:absolute;inset:0;z-index:1;clip-path:circle(0 at 0 0)}
.shot{position:absolute;inset:0;padding:14px 28px;display:grid;grid-template-columns:1.4fr 1fr 1fr;grid-template-rows:28px 1fr;gap:10px;box-sizing:border-box}
.shot span{border-radius:6px}
.nav{position:absolute;left:0;right:0;top:0;z-index:6;display:flex;align-items:center;padding:12px;pointer-events:none}
.nm{pointer-events:auto;height:40px;display:flex;align-items:center;padding:0 16px 3px;box-sizing:border-box;line-height:1;border-radius:20px;background:var(--pill);color:#FF6B5C;font-size:16px;opacity:0;transform:translateX(-16px);transition:opacity .35s,transform .55s cubic-bezier(.2,.8,.2,1),background .3s;cursor:pointer;text-decoration:none}
.vp.sc .nm{opacity:1;transform:none}
.pill{pointer-events:auto;position:relative;height:40px;width:40px;border-radius:20px;background:var(--pill);overflow:hidden;transition:width .55s cubic-bezier(.65,0,.35,1),background .3s}
.bgr{position:absolute;left:0;top:0;width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:var(--pt);cursor:pointer;font-size:20px;line-height:1;transition:opacity .2s,transform .45s}
.bgr .ic,.tg .ic{display:block;line-height:1}
.vp.op .bgr{opacity:0;transform:rotate(90deg);pointer-events:none}
.lk{position:absolute;left:0;top:0;height:40px;display:flex;align-items:center;gap:2px;padding:0 4px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s}
